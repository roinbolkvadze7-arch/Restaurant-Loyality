<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>მიმტნის პანელი - ბონუს სისტემა</title>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: linear-gradient(135deg, #d4af37, #ffd700, #b8860b);
    --bg: radial-gradient(ellipse at center, #0f0f23, #000000);
    --surface: linear-gradient(145deg, #1a1a2e, #16213e);
    --border: rgba(212, 175, 55, 0.25);
    --text: #f8f6f0;
    --radius: 20px;
    --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Geologica', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    max-width: 400px;
    width: 100%;
    text-align: center;
  }

  .logo {
    font-size: 64px;
    margin-bottom: 16px;
  }

  .title {
    font-size: 28px;
    font-weight: 500;
    background: var(--gold);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .subtitle {
    color: rgba(248, 246, 240, 0.7);
    font-size: 16px;
    margin-bottom: 48px;
  }

  .menu-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
    text-decoration: none;
    color: var(--text);
    display: block;
    transition: all 0.3s ease;
    box-shadow: var(--shadow);
  }

  .menu-item:hover {
    transform: translateY(-4px);
    box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.9);
    border-color: rgba(212, 175, 55, 0.5);
  }

  .menu-icon {
    font-size: 32px;
    margin-bottom: 12px;
    display: block;
  }

  .menu-title {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 6px;
  }

  .menu-desc {
    font-size: 14px;
    color: rgba(248, 246, 240, 0.7);
    line-height: 1.4;
  }

  .recommended {
    position: relative;
  }

  .recommended::before {
    content: '⭐ რეკომენდებული';
    position: absolute;
    top: -8px;
    right: 16px;
    background: var(--gold);
    color: #000;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 12px;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="container">
  <div class="logo">🍽️</div>
  <h1 class="title">მიმტნის პანელი</h1>
  <p class="subtitle">ბონუს ქულების სისტემა</p>

  <a href="scanner.html" class="menu-item recommended">
    <span class="menu-icon">📱</span>
    <div class="menu-title">QR სკანერი</div>
    <div class="menu-desc">სწრაფი ქულების დამუშავება QR კოდით</div>
  </a>

  <a href="admin.html" class="menu-item">
    <span class="menu-icon">⚙️</span>
    <div class="menu-title">ადმინ პანელი</div>
    <div class="menu-desc">სრული მართვის ინტერფეისი</div>
  </a>

  <a href="index.html" class="menu-item">
    <span class="menu-icon">👤</span>
    <div class="menu-title">სტუმრის აპი</div>
    <div class="menu-desc">სტუმრების ინტერფეისის ნახვა</div>
  </a>

  <div style="margin-top: 32px; font-size: 12px; color: rgba(248, 246, 240, 0.5);">
    v2.0 • Restaurant Loyalty System
  </div>
</div>

</body>
</html>
